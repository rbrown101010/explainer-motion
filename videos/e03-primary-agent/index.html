<!doctype html>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      :root { --ground: #212120; --panel: #2b2b29; --text: #f4f3ef; --muted: #9c9b96; --accent: #f07a5a; --line: rgba(255,255,255,0.08); --focus: rgba(244,243,239,0.55); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Geist", ui-sans-serif, system-ui, sans-serif; color: var(--text); }
      #scene { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .node { position: absolute; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); }
      .grid { position: absolute; display: grid; }
      .tile { display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); }
      .label { position: absolute; font-size: 40px; font-weight: 500; text-align: center; }
      .muted { color: var(--muted); }
      #wires { position: absolute; left: 0; top: 0; }
    </style>
  </head>

          <div class="tile pick" style="height: 150px; border-radius: 24px"><svg width="64" height="52" viewBox="0 0 64 52" fill="none" aria-hidden="true"><rect x="3" y="3" width="58" height="46" rx="14" stroke="#9c9b96" stroke-width="5"></rect><circle cx="22" cy="26" r="5" fill="#9c9b96"></circle><circle cx="42" cy="26" r="5" fill="#9c9b96"></circle></svg></div>
          <div class="tile pick" style="height: 150px; border-radius: 24px"><svg width="64" height="52" viewBox="0 0 64 52" fill="none" aria-hidden="true"><rect x="3" y="3" width="58" height="46" rx="14" stroke="#9c9b96" stroke-width="5"></rect><circle cx="22" cy="26" r="5" fill="#9c9b96"></circle><circle cx="42" cy="26" r="5" fill="#9c9b96"></circle></svg></div>
          <div class="tile pick" style="height: 150px; border-radius: 24px"><svg width="64" height="52" viewBox="0 0 64 52" fill="none" aria-hidden="true"><rect x="3" y="3" width="58" height="46" rx="14" stroke="#9c9b96" stroke-width="5"></rect><circle cx="22" cy="26" r="5" fill="#9c9b96"></circle><circle cx="42" cy="26" r="5" fill="#9c9b96"></circle></svg></div>
          <div class="tile pick" style="height: 150px; border-radius: 24px"><svg width="64" height="52" viewBox="0 0 64 52" fill="none" aria-hidden="true"><rect x="3" y="3" width="58" height="46" rx="14" stroke="#9c9b96" stroke-width="5"></rect><circle cx="22" cy="26" r="5" fill="#9c9b96"></circle><circle cx="42" cy="26" r="5" fill="#9c9b96"></circle></svg></div>

        </div>
        <div id="pick-label" class="label muted" style="left: 220px; top: 850px; width: 600px">Pick an agent</div>
        <div id="you-b" class="node" style="left: 1350px; top: 190px; width: 100px; height: 100px; border-radius: 50%">
          <svg width="48" height="52" viewBox="0 0 96 104" fill="none" aria-hidden="true"><circle cx="48" cy="30" r="22" stroke="#9c9b96" stroke-width="9"></circle><path d="M8 100 C8 74 26 60 48 60 C70 60 88 74 88 100" stroke="#9c9b96" stroke-width="9" stroke-linecap="round"></path></svg>
        </div>
        <div id="primary" class="node" style="left: 1300px; top: 360px; width: 200px; height: 200px; border-radius: 28px; border: 2px solid var(--focus)">

          <div class="tile sub" style="height: 100px; border-radius: 18px"><svg width="40" height="32" viewBox="0 0 64 52" fill="none" aria-hidden="true"><rect x="3" y="3" width="58" height="46" rx="14" stroke="#9c9b96" stroke-width="6"></rect><circle cx="22" cy="26" r="6" fill="#9c9b96"></circle><circle cx="42" cy="26" r="6" fill="#9c9b96"></circle></svg></div>
        </div>
        <div id="primary-label" class="label" style="left: 1100px; top: 850px; width: 600px">Primary agent</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // before: you have to pick
      tl.fromTo("#you-a", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.2);
      tl.fromTo(".pick", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)", stagger: 0.07 }, 0.4);
      tl.fromTo("#pick-lines", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.9);
      tl.fromTo("#pick-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.0);
      tl.fromTo("#divider", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.4);
      // after: one primary agent routes the work
      tl.fromTo("#you-b", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.7);
      tl.fromTo("#in-arrow", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.05);
      tl.fromTo("#primary", { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 2.25);
      tl.fromTo("#fan", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 2.75);
      tl.fromTo(".sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 3.05);
      tl.fromTo("#primary-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.2);
      tl.to("#scene", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
