<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>E9 · An agent with its own tools</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      :root { --ground: #212120; --panel: #2b2b29; --text: #f4f3ef; --muted: #9c9b96; --accent: #f07a5a; --line: rgba(255,255,255,0.10); --focus: rgba(244,243,239,0.55); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Geist", ui-sans-serif, system-ui, sans-serif; color: var(--text); }
      #scene { position: absolute; inset: 0; }
      #spokes { position: absolute; left: 0; top: 0; }
      .tool { position: absolute; width: 150px; height: 150px; border-radius: 28px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
      .tool img { display: block; width: auto; }
      #hub { position: absolute; left: 830px; top: 410px; width: 260px; height: 260px; border-radius: 50%; background: var(--panel); border: 2px solid var(--focus); display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="scene">
        <svg id="spokes" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
          <path class="spoke" d="M960 410 V285" pathLength="1" stroke-dasharray="1" stroke="#f07a5a" stroke-width="4" stroke-linecap="round"></path>
          <path class="spoke" d="M1072.6 475 L1180.8 412.5" pathLength="1" stroke-dasharray="1" stroke="#f07a5a" stroke-width="4" stroke-linecap="round"></path>
          <path class="spoke" d="M1072.6 605 L1180.8 667.5" pathLength="1" stroke-dasharray="1" stroke="#f07a5a" stroke-width="4" stroke-linecap="round"></path>
          <path class="spoke" d="M960 670 V795" pathLength="1" stroke-dasharray="1" stroke="#f07a5a" stroke-width="4" stroke-linecap="round"></path>
          <path class="spoke" d="M847.4 605 L739.2 667.5" pathLength="1" stroke-dasharray="1" stroke="#f07a5a" stroke-width="4" stroke-linecap="round"></path>
          <path class="spoke" d="M847.4 475 L739.2 412.5" pathLength="1" stroke-dasharray="1" stroke="#f07a5a" stroke-width="4" stroke-linecap="round"></path>
        </svg>
        <div id="hub">
          <svg width="124" height="100" viewBox="0 0 64 52" fill="none" aria-hidden="true"><rect x="3" y="3" width="58" height="46" rx="14" stroke="#f4f3ef" stroke-width="4"></rect><circle class="eye" cx="22" cy="26" r="5" fill="#f4f3ef"></circle><circle class="eye" cx="42" cy="26" r="5" fill="#f4f3ef"></circle></svg>
        </div>
        <div class="tool" style="left: 885px; top: 125px"><img src="assets/gmail.png" alt="Gmail" style="height: 54px" /></div>
        <div class="tool" style="left: 1179px; top: 295px">
          <svg width="84" height="60" viewBox="0 0 84 60" fill="none" aria-hidden="true"><rect x="3" y="3" width="78" height="54" rx="9" stroke="#f4f3ef" stroke-width="5"></rect><path d="M3 20 H81" stroke="#f4f3ef" stroke-width="6"></path><path d="M14 42 H32" stroke="#f4f3ef" stroke-width="5" stroke-linecap="round"></path></svg>
        </div>
        <div class="tool" style="left: 1179px; top: 635px"><img src="assets/slack.png" alt="Slack" style="height: 62px" /></div>
        <div class="tool" style="left: 885px; top: 805px"><img src="assets/googlecalendar.png" alt="Google Calendar" style="height: 62px" /></div>
        <div class="tool" style="left: 591px; top: 635px"><img src="assets/notion.png" alt="Notion" style="height: 62px" /></div>
        <div class="tool" style="left: 591px; top: 295px">
          <svg width="66" height="66" viewBox="0 0 66 66" fill="none" aria-hidden="true"><circle cx="33" cy="33" r="29" stroke="#f4f3ef" stroke-width="5"></circle><path d="M4 33 H62 M33 4 C18 20 18 46 33 62 M33 4 C48 20 48 46 33 62" stroke="#f4f3ef" stroke-width="5"></path></svg>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // the agent arrives
      tl.fromTo("#hub", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0.2);
      tl.fromTo(".eye", { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.1, duration: 0.08, yoyo: true, repeat: 1 }, 0.95);
      // and plugs into its own tools, one by one
      tl.fromTo(".spoke", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", stagger: 0.22 }, 1.1);
      tl.fromTo(".tool", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.22 }, 1.3);
      tl.fromTo("#hub", { boxShadow: "0 0 0 0 rgba(240,122,90,0)" }, { immediateRender: false, boxShadow: "0 0 0 16px rgba(240,122,90,0.16)", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.9);
      tl.fromTo(".eye", { scaleY: 1 }, { immediateRender: false, scaleY: 0.1, duration: 0.08, yoyo: true, repeat: 1 }, 4.2);
      tl.to("#scene", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
