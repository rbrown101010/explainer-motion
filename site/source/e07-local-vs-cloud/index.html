<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>E7 · Local vs cloud agent</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      :root { --ground: #212120; --panel: #2b2b29; --text: #f4f3ef; --muted: #9c9b96; --accent: #f07a5a; --line: rgba(255,255,255,0.10); --focus: rgba(244,243,239,0.55); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Geist", ui-sans-serif, system-ui, sans-serif; color: var(--text); }
      #scene { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 120px; }
      .col { display: flex; flex-direction: column; align-items: center; gap: 36px; }
      .panel { width: 560px; height: 480px; border-radius: 28px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; }
      .panel.focus { border: 2px solid var(--focus); }
      .items { display: flex; align-items: center; gap: 48px; }
      .label { font-size: 40px; font-weight: 500; }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="scene">
        <div class="col">
          <div id="local-panel" class="panel focus">
            <svg width="300" height="190" viewBox="0 0 300 190" fill="none" aria-hidden="true">
              <rect id="lid" x="44" y="8" width="212" height="140" rx="14" pathLength="1" stroke-dasharray="1" stroke="#f4f3ef" stroke-width="7"></rect>
              <path id="base" d="M8 172 H292 L276 152 H24 Z" pathLength="1" stroke-dasharray="1" stroke="#f4f3ef" stroke-width="7" stroke-linejoin="round"></path>
            </svg>
            <div class="items">
              <svg class="item" width="62" height="62" viewBox="0 0 62 62" fill="none" aria-hidden="true"><circle cx="20" cy="31" r="13" stroke="#9c9b96" stroke-width="5"></circle><path d="M33 31 H58 M50 31 V42 M42 31 V39" stroke="#9c9b96" stroke-width="5" stroke-linecap="round"></path></svg>
              <svg class="item" width="66" height="56" viewBox="0 0 66 56" fill="none" aria-hidden="true"><path d="M4 10 a6 6 0 0 1 6 -6 H26 L34 14 H56 a6 6 0 0 1 6 6 V46 a6 6 0 0 1 -6 6 H10 a6 6 0 0 1 -6 -6 Z" stroke="#9c9b96" stroke-width="5" stroke-linejoin="round"></path></svg>
              <svg class="item" width="62" height="56" viewBox="0 0 62 56" fill="none" aria-hidden="true"><rect x="3" y="3" width="56" height="50" rx="8" stroke="#9c9b96" stroke-width="5"></rect><path d="M24 17 L40 28 L24 39 Z" fill="#9c9b96"></path></svg>
            </div>
          </div>
          <div id="local-label" class="label">Local</div>
        </div>
        <div class="col">
          <div id="cloud-panel" class="panel">
            <svg width="300" height="200" viewBox="0 0 300 200" fill="none" aria-hidden="true">
              <path id="cloud" d="M78 176 H226 a58 58 0 0 0 6 -115 a78 78 0 0 0 -148 18 a49 49 0 0 0 -6 97 Z" pathLength="1" stroke-dasharray="1" stroke="#9c9b96" stroke-width="7" stroke-linejoin="round"></path>
            </svg>
          </div>
          <div id="cloud-label" class="label muted">Cloud</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // local: your machine, your logins, your files, your footage
      tl.fromTo("#local-panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.2);
      tl.fromTo(["#lid", "#base"], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.2 }, 0.45);
      tl.fromTo(".item", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.8)", stagger: 0.14 }, 1.2);
      tl.fromTo("#local-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 0.9);
      // cloud: always on, but away from your stuff
      tl.fromTo("#cloud-panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.9);
      tl.fromTo("#cloud", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 2.15);
      tl.fromTo("#cloud-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 2.4);
      tl.fromTo("#cloud", { y: 0 }, { immediateRender: false, y: -10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.1);
      tl.to("#scene", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
